<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connections</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <p class="blurb">Create four groups of four!</p>
    <div class="tileGroup">
        <div class="buttonContainer">
            <button class="buttonTile" onclick="buttonClick(this)">1</button>
        </div>
        <div class="buttonContainer">
            <button class="buttonTile" onclick="buttonClick(this)">2</button>
        </div>
        <div class="buttonContainer">
            <button class="buttonTile" onclick="buttonClick(this)">3</button>
        </div>
        <div class="buttonContainer">
            <button class="buttonTile" onclick="buttonClick(this)">4</button>
        </div>
        <div class="buttonContainer">
            <button class="buttonTile" onclick="buttonClick(this)">5</button>
        </div>
    </div>
    <div class="mistakesGroup">
        <p>Mistakes Remaining: * * * *</p>
    </div>
    <div class="controlButtons">
        <button id=""shuffleButton" onclick="shuffle()">Shuffle</button>
        <button id="deselectButton" disabled onclick="deselectAll()">Deselect All</button>
        <button id="submitButton" disabled onclick="submit()">Submit</button>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
